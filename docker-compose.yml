services:
  snooze-slim:
    build:
      context: .
      target: slim
    image: snooze-ml:slim
    container_name: snooze-slim
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./models:/models:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  snooze-cpu:
    build:
      context: .
      target: cpu
    image: snooze-ml:cpu
    container_name: snooze-cpu
    ports:
      - "8081:8080"
      - "50052:50051"
    volumes:
      - ./models:/models:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  snooze-cuda:
    profiles: ["gpu", "cuda"]
    build:
      context: .
      target: cuda
    image: snooze-ml:cuda
    container_name: snooze-cuda
    ports:
      - "8082:8080"
      - "50053:50051"
    volumes:
      - ./models:/models:ro
    environment:
      - RUST_LOG=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
