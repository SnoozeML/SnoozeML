# Cargo configuration for SnoozeML.
#
# Enforces --as-needed on Linux targets so transitive native build scripts
# do not bind unused shared libraries into the executable's DT_NEEDED table.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--as-needed"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--as-needed"]
