services:
  snooze:
    image: ${SNOOZE_IMAGE:-snooze:local}
    user: "0:0"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: slim
    environment:
      - RUST_LOG=info
    ports:
      - "8080"
      - "50051"
    volumes:
      - ./models:/models
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --grpc-port
      - "50051"
      - --models-dir
      - "/models"
    healthcheck:
      test: ["CMD", "snooze", "status", "--endpoint", "http://127.0.0.1:8080"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s
