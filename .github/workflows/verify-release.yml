name: Verify Prebuilt Release Binary (Zero-Compile E2E)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to verify (leave empty to verify the latest published release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-linux-release:
    name: Verify Prebuilt Release on CPU-Only Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuilt release archives (zero compile time)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          if [ -n "${TAG_NAME}" ]; then
            gh release download "${TAG_NAME}" \
              --pattern "snooze-linux-x86_64*.tar.gz*" \
              --dir release_dl
          else
            gh release download \
              --pattern "snooze-linux-x86_64*.tar.gz*" \
              --dir release_dl
          fi

      - name: Verify SHA-256 checksums, ABI symbols, and CLI on CPU-only host
        run: |
          cd release_dl
          sha256sum -c snooze-linux-x86_64.tar.gz.sha256
          sha256sum -c snooze-linux-x86_64-cpu.tar.gz.sha256

          tar -xzf snooze-linux-x86_64.tar.gz
          tar -xzf snooze-linux-x86_64-cpu.tar.gz

          for pkg in snooze-linux-x86_64 snooze-linux-x86_64-cpu; do
            echo "=== Verifying ${pkg} ==="
            ldd "./${pkg}/bin/snooze"
            if ldd "./${pkg}/bin/snooze" | grep -i "not found"; then
              echo "::error::Missing dynamic libraries in ${pkg}!"
              exit 1
            fi
            if readelf -d "./${pkg}/bin/snooze" | grep -E "NEEDED.*(libcuda|libcudart|libcurand|libcublas|libnvrtc|libonnxruntime|libstdc\+\+)"; then
              echo "::error::${pkg} has forbidden hard DT_NEEDED link dependency!"
              exit 1
            fi
            "./${pkg}/bin/snooze" --version
            "./${pkg}/bin/snooze" --help > /dev/null
          done

      - name: Stage prebuilt binary into target/release for E2E suite
        run: |
          mkdir -p target/release/lib
          cp release_dl/snooze-linux-x86_64/bin/snooze target/release/snooze
          cp -a release_dl/snooze-linux-x86_64/lib/* target/release/lib/

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[all,dev]" pytest pytest-asyncio scikit-learn xgboost onnx skl2onnx

      - name: Run full E2E test suite against prebuilt release binary
        run: |
          pytest python/tests -v
