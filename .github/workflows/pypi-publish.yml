name: Publish Python SDK to PyPI

on:
  push:
    branches:
      - main
    paths:
      # Only trigger when the Python SDK manifest or workflow is touched
      - "python/pyproject.toml"
      - ".github/workflows/pypi-publish.yml"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish even if version did not change between commits"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Version Change Gatekeeper
  # Inspects python/pyproject.toml and checks PyPI & the previous commit.
  # If the version is not yet on PyPI (or changed from the previous commit), publishes.
  # ============================================================================
  check-version:
    name: Check version bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version_diff.outputs.changed }}
      version: ${{ steps.version_diff.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20 # Sufficient depth so github.event.before is reachable on multi-commit pushes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare python/pyproject.toml version with PyPI and previous commit
        id: version_diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: |
          python - << 'EOF'
          import os, subprocess, sys, tomllib, urllib.error, urllib.request

          pyproject_path = "python/pyproject.toml"
          try:
              with open(pyproject_path, "r", encoding="utf-8-sig") as f:
                  new_ver = tomllib.loads(f.read()).get("project", {}).get("version")
          except Exception as e:
              print(f"Error reading {pyproject_path}: {e}", file=sys.stderr)
              sys.exit(1)

          if not new_ver:
              print(f"Error: project.version missing in {pyproject_path}", file=sys.stderr)
              sys.exit(1)

          old_ver = None
          candidates = []
          before_sha = os.environ.get("BEFORE_SHA", "").strip()
          if before_sha and before_sha != "0000000000000000000000000000000000000000":
              candidates.append(f"{before_sha}:{pyproject_path}")
          candidates.append(f"HEAD~1:{pyproject_path}")

          for rev in candidates:
              try:
                  old_bytes = subprocess.check_output(
                      ["git", "show", rev],
                      stderr=subprocess.DEVNULL
                  )
                  old_ver = tomllib.loads(old_bytes.decode("utf-8-sig")).get("project", {}).get("version")
                  if old_ver:
                      print(f"Retrieved previous version ({old_ver}) from git rev: {rev}")
                      break
              except Exception:
                  continue

          # Check whether new_ver is already published on PyPI
          already_on_pypi = None
          pypi_url = f"https://pypi.org/pypi/snoozeml/{new_ver}/json"
          try:
              req = urllib.request.Request(pypi_url, method="HEAD")
              with urllib.request.urlopen(req, timeout=10) as resp:
                  already_on_pypi = (resp.status == 200)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  already_on_pypi = False
          except Exception as e:
              print(f"Warning: could not query PyPI ({e}); falling back to git diff")

          force = os.environ.get("FORCE_PUBLISH", "false").lower() == "true"
          if force:
              changed = "true"
          elif already_on_pypi is False:
              changed = "true"
          elif already_on_pypi is True:
              changed = "false"
          else:
              changed = "true" if (new_ver != old_ver) else "false"

          print(
              f"Version check: old={old_ver} -> new={new_ver}, "
              f"already_on_pypi={already_on_pypi}, force={force} => changed={changed}"
          )

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as out:
                  out.write(f"changed={changed}\n")
                  out.write(f"version={new_ver}\n")
                  out.write(f"old_version={old_ver or ''}\n")
          EOF

  # ============================================================================
  # JOB 2: Build Pure Python Wheel & Source Distribution (sdist)
  # Because snoozeml is pure Python (no compiled C/Rust extensions), a single
  # build produces a universal wheel (py3-none-any.whl) and sdist (.tar.gz).
  # ============================================================================
  build-package:
    name: Build sdist and universal wheel
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and Twine
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and universal wheel
        run: |
          python -m build python/ --outdir dist/

      - name: Validate distribution packages with Twine
        run: |
          twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  # ============================================================================
  # JOB 3: Multi-OS & Multi-Python Verification Matrix
  # Verifies that the built universal wheel installs cleanly and imports without
  # errors across Linux, macOS, and Windows, and Python 3.9 through 3.13.
  # ============================================================================
  test-distributions:
    name: Verify Wheel (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: [check-version, build-package]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import snoozeml; print('Verified SnoozeML version:', snoozeml.__version__)"
          python -c "from snoozeml import (Client, AsyncClient, Role, JwtAlgorithm, SnoozeConfig, SnoozeDaemon)"

  # ============================================================================
  # JOB 4: Publish to PyPI via OIDC Trusted Publishing
  # Uses PyPI Trusted Publishing (OIDC token exchange) within the 'pypi' environment.
  # ============================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, build-package, test-distributions]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/snoozeml
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
