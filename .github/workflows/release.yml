name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag to publish (leave empty for build-only artifact verification)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard builds (all backends, all streams, and hardware accelerators)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: snooze-linux-x86_64
            features: "streams-all,cuda,candle-cuda,tensorrt"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: snooze-linux-aarch64
            features: "streams-all,cuda,tensorrt,ort/lax-feature-matching"

          # Lightweight CPU-only builds (all backends and all streams, CPU execution only)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: snooze-linux-x86_64-cpu
            features: "streams-all"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: snooze-linux-aarch64-cpu
            features: "streams-all"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            ca-certificates \
            build-essential \
            cmake \
            wget

      - name: Install CUDA 13.0 and cuDNN 9 (for Linux x86_64 CUDA builds)
        if: matrix.target == 'x86_64-unknown-linux-gnu' && contains(matrix.features, 'cuda')
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-toolkit-13-0 \
            libcudnn9-cuda-13 \
            libcudnn9-dev-cuda-13
          echo "/usr/local/cuda-13.0/bin" >> $GITHUB_PATH
          echo "CUDA_HOME=/usr/local/cuda-13.0" >> $GITHUB_ENV
          echo "CUDA_PATH=/usr/local/cuda-13.0" >> $GITHUB_ENV
          echo "CUDA_COMPUTE_CAP=75" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.artifact_name }}

      - name: Build release binary
        run: |
          cargo build --release --bin snooze --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: Package tarball and SHA-256 checksum
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/bin dist/${{ matrix.artifact_name }}/lib
          cp target/${{ matrix.target }}/release/snooze dist/${{ matrix.artifact_name }}/bin/snooze
          strip dist/${{ matrix.artifact_name }}/bin/snooze || true

          # Bundle any ONNX Runtime shared libraries downloaded by ort during build (dereference symlinks via -L)
          find target/${{ matrix.target }}/release -maxdepth 1 \
            -name "libonnxruntime*.so*" \
            -exec cp -L {} dist/${{ matrix.artifact_name }}/lib/ \; 2>/dev/null || true

          cp LICENSE README.md install.sh dist/${{ matrix.artifact_name }}/
          tar -C dist -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Smoke test packaged binary
        run: |
          ./dist/${{ matrix.artifact_name }}/bin/snooze --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  build-macos:
    name: Build (${{ matrix.artifact_name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: snooze-macos-aarch64
            features: "streams-all,coreml"
          - artifact_name: snooze-macos-aarch64-cpu
            features: "streams-all"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin-${{ matrix.artifact_name }}

      - name: Build release binary
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,@executable_path/../lib -C link-arg=-Wl,-rpath,@executable_path"
        run: |
          cargo build --release --bin snooze --target aarch64-apple-darwin --features "${{ matrix.features }}"

      - name: Package tarball and SHA-256 checksum
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/bin dist/${{ matrix.artifact_name }}/lib
          cp target/aarch64-apple-darwin/release/snooze dist/${{ matrix.artifact_name }}/bin/snooze
          strip dist/${{ matrix.artifact_name }}/bin/snooze || true

          # Bundle any ONNX Runtime shared libraries downloaded by ort during build (dereference symlinks via -L)
          find target/aarch64-apple-darwin/release -maxdepth 1 \
            -name "libonnxruntime*.dylib*" \
            -exec cp -L {} dist/${{ matrix.artifact_name }}/lib/ \; 2>/dev/null || true

          cp LICENSE README.md install.sh dist/${{ matrix.artifact_name }}/
          tar -C dist -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Smoke test packaged binary
        run: |
          ./dist/${{ matrix.artifact_name }}/bin/snooze --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  build-windows:
    name: Build (${{ matrix.artifact_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: snooze-windows-x86_64
            features: "streams-all,cuda,tensorrt"
          - artifact_name: snooze-windows-x86_64-cpu
            features: "streams-all"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-${{ matrix.artifact_name }}

      - name: Build release binary
        run: |
          cargo build --release --bin snooze --target x86_64-pc-windows-msvc --features "${{ matrix.features }}"

      - name: Package zip archive and SHA-256 checksum
        shell: pwsh
        run: |
          $pkgDir = "dist/${{ matrix.artifact_name }}/bin"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/snooze.exe" -Destination "$pkgDir/snooze.exe"

          Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release" -Depth 0 -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination $pkgDir -Force }

          Copy-Item "LICENSE", "README.md", "install.ps1" -Destination "dist/${{ matrix.artifact_name }}/"
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}/*" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

          $hash = (Get-FileHash -Path "${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}.zip" | Out-File -FilePath "${{ matrix.artifact_name }}.zip.sha256" -Encoding ascii -NoNewline

      - name: Smoke test packaged binary
        shell: pwsh
        run: |
          ./dist/${{ matrix.artifact_name }}/bin/snooze.exe --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Copy installer scripts to release assets
        run: |
          cp install.sh install.ps1 release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
