name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag to publish (leave empty for build-only artifact verification)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: snooze-linux-x86_64
            features: "streams-all"
            rpath_flags: "-C link-arg=-Wl,-rpath,$ORIGIN/../lib:$ORIGIN"
          - os: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            artifact_name: snooze-linux-aarch64
            features: "streams-all"
            rpath_flags: "-C link-arg=-Wl,-rpath,$ORIGIN/../lib:$ORIGIN"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure RHEL 8 / glibc 2.28 build dependencies
        run: |
          dnf install -y pkgconfig openssl-devel ca-certificates

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-glibc2.28-${{ matrix.features }}

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rpath_flags }}
        run: |
          cargo build --release --bin snooze --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: Package tarball and SHA-256 checksum
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}/bin dist/${{ matrix.artifact_name }}/lib
          cp target/${{ matrix.target }}/release/snooze dist/${{ matrix.artifact_name }}/bin/snooze
          strip dist/${{ matrix.artifact_name }}/bin/snooze || true

          # Bundle any ONNX Runtime shared libraries downloaded by ort during build
          find target/${{ matrix.target }}/release -maxdepth 4 \
            -name "libonnxruntime*.so*" \
            -exec cp -P {} dist/${{ matrix.artifact_name }}/lib/ \; 2>/dev/null || true

          cp LICENSE README.md install.sh dist/${{ matrix.artifact_name }}/
          tar -C dist -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Smoke test packaged binary on glibc 2.28 (RHEL 8 compatible)
        run: |
          ./dist/${{ matrix.artifact_name }}/bin/snooze --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  build-macos:
    name: Build (snooze-macos-aarch64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin-streams-all-coreml

      - name: Build release binary
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,@executable_path/../lib -C link-arg=-Wl,-rpath,@executable_path"
        run: |
          cargo build --release --bin snooze --target aarch64-apple-darwin --features "streams-all,coreml"

      - name: Package tarball and SHA-256 checksum
        run: |
          mkdir -p dist/snooze-macos-aarch64/bin dist/snooze-macos-aarch64/lib
          cp target/aarch64-apple-darwin/release/snooze dist/snooze-macos-aarch64/bin/snooze
          strip dist/snooze-macos-aarch64/bin/snooze || true

          # Bundle any ONNX Runtime shared libraries downloaded by ort during build
          find target/aarch64-apple-darwin/release -maxdepth 4 \
            -name "libonnxruntime*.dylib*" \
            -exec cp -P {} dist/snooze-macos-aarch64/lib/ \; 2>/dev/null || true

          cp LICENSE README.md install.sh dist/snooze-macos-aarch64/
          tar -C dist -czf snooze-macos-aarch64.tar.gz snooze-macos-aarch64
          shasum -a 256 snooze-macos-aarch64.tar.gz > snooze-macos-aarch64.tar.gz.sha256

      - name: Smoke test packaged binary
        run: |
          ./dist/snooze-macos-aarch64/bin/snooze --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: snooze-macos-aarch64
          path: |
            snooze-macos-aarch64.tar.gz
            snooze-macos-aarch64.tar.gz.sha256

  build-windows:
    name: Build (snooze-windows-x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-streams-all

      - name: Build release binary
        run: |
          cargo build --release --bin snooze --target x86_64-pc-windows-msvc --features "streams-all"

      - name: Package zip archive and SHA-256 checksum
        shell: pwsh
        run: |
          $pkgDir = "dist/snooze-windows-x86_64/bin"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/snooze.exe" -Destination "$pkgDir/snooze.exe"

          Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release" -Recurse -Filter "*onnxruntime*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination $pkgDir -Force }

          Copy-Item "LICENSE", "README.md", "install.ps1" -Destination "dist/snooze-windows-x86_64/"
          Compress-Archive -Path "dist/snooze-windows-x86_64/*" -DestinationPath "snooze-windows-x86_64.zip" -Force

          $hash = (Get-FileHash -Path "snooze-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  snooze-windows-x86_64.zip" | Out-File -FilePath "snooze-windows-x86_64.zip.sha256" -Encoding ascii -NoNewline

      - name: Smoke test packaged binary
        shell: pwsh
        run: |
          ./dist/snooze-windows-x86_64/bin/snooze.exe --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: snooze-windows-x86_64
          path: |
            snooze-windows-x86_64.zip
            snooze-windows-x86_64.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Copy installer scripts to release assets
        run: |
          cp install.sh install.ps1 release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
