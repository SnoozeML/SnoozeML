name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ORT_VERSION: "1.31.1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            ort_archive: onnxruntime-linux-x64-gpu_cuda13-1.31.1.tgz
            artifact_name: snooze-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ort_archive: onnxruntime-linux-aarch64-1.31.1.tgz
            artifact_name: snooze-linux-aarch64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            ort_archive: onnxruntime-osx-arm64-1.31.1.tgz
            artifact_name: snooze-macos-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            ort_archive: onnxruntime-win-x64-gpu_cuda13-1.31.1.zip
            artifact_name: snooze-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config libssl-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust Toolchain (1.92+)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download ONNX Runtime v${{ env.ORT_VERSION }} Shared Libraries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ort_dist
          curl -fSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${{ matrix.ort_archive }}" -o ort.tgz
          tar -xzf ort.tgz --strip-components=1 -C ort_dist
          rm ort.tgz

      - name: Download ONNX Runtime v${{ env.ORT_VERSION }} Shared Libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ort_dist
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/${{ matrix.ort_archive }}" -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort_tmp
          Move-Item -Path ort_tmp/*/* -Destination ort_dist/
          Remove-Item -Recurse -Force ort.zip, ort_tmp

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run Tests with Dynamic ORT
        shell: bash
        env:
          ORT_DYLIB_PATH: ${{ runner.os == 'Windows' && format('{0}/ort_dist/lib/onnxruntime.dll', github.workspace) || (runner.os == 'macOS' && format('{0}/ort_dist/lib/libonnxruntime.dylib', github.workspace) || format('{0}/ort_dist/lib/libonnxruntime.so', github.workspace)) }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/ort_dist/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/ort_dist/lib
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package/lib
          cp target/${{ matrix.target }}/release/snooze package/
          cp -P ort_dist/lib/libonnxruntime* package/lib/
          tar -czf "${{ matrix.artifact_name }}" -C package .

      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/lib
          Copy-Item "target/${{ matrix.target }}/release/snooze.exe" -Destination "package/"
          Copy-Item "ort_dist/lib/onnxruntime*.dll" -Destination "package/"
          Copy-Item "ort_dist/lib/onnxruntime*.dll" -Destination "package/lib/"
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
