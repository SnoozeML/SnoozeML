name: Publish Container Images (GHCR)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag to publish (leave empty for build-only verification)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # JOB 1: Build & Smoke-Test Images (1 Runner per Architecture)
  # Because slim, cpu, and cuda share the unified 'builder' stage in Dockerfile,
  # building all targets for an architecture on a single runner compiles the
  # Rust workspace ONCE and reuses the local BuildKit layer cache across targets.
  # ============================================================================
  build-images:
    name: Build Images (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            targets: "slim cpu cuda"
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            targets: "slim cpu"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke-test, and push targets for ${{ matrix.arch }}
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SHOULD_PUSH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') }}
        run: |
          set -euo pipefail
          first_target=true
          for target in ${{ matrix.targets }}; do
            echo "=== Building target: ${target} (${{ matrix.arch }}) ==="
            cache_args=(--cache-from "type=gha,scope=builder-${{ matrix.arch }}")
            if [ "$first_target" = "true" ]; then
              cache_args+=(--cache-to "type=gha,mode=max,scope=builder-${{ matrix.arch }}")
              first_target=false
            fi

            docker buildx build \
              --platform "${{ matrix.platform }}" \
              --target "${target}" \
              "${cache_args[@]}" \
              --load \
              -t "snooze-ci:${target}-${{ matrix.arch }}" \
              .

            echo "=== Smoke testing snooze-ci:${target}-${{ matrix.arch }} ==="
            docker run --rm "snooze-ci:${target}-${{ matrix.arch }}" --version
            docker run --rm "snooze-ci:${target}-${{ matrix.arch }}" --help > /dev/null

            if [ "${SHOULD_PUSH}" = "true" ]; then
              mkdir -p "/tmp/digests/${target}"
              metadata_file="/tmp/metadata-${target}-${{ matrix.arch }}.json"
              docker buildx build \
                --platform "${{ matrix.platform }}" \
                --target "${target}" \
                --cache-from "type=gha,scope=builder-${{ matrix.arch }}" \
                --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" \
                --metadata-file "${metadata_file}" \
                .
              digest=$(python3 -c "import json; d=json.load(open('${metadata_file}'))['containerimage.digest']; print(d.removeprefix('sha256:'))")
              touch "/tmp/digests/${target}/${digest}"
            fi
          done

      - name: Upload digest artifacts
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # JOB 2: Create & Publish Tagged Manifests to GHCR
  # Assigns versioned and rolling tags to each flavor, making 'cuda' the default.
  # ============================================================================
  publish-manifests:
    name: Publish Manifest (${{ matrix.target }})
    needs: build-images
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cuda
            is_default: true
          - target: cpu
            is_default: false
          - target: slim
            is_default: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            # Rolling flavor tags (:cuda, :cpu, :slim)
            type=raw,value=${{ matrix.target }}
            # Friendly aliases (:full for cuda, :lite for slim)
            type=raw,value=full,enable=${{ matrix.target == 'cuda' }}
            type=raw,value=lite,enable=${{ matrix.target == 'slim' }}
            # Default tags (:latest, :0.1.2, :0.1) assigned to 'cuda'
            type=raw,value=latest,enable=${{ matrix.is_default }}
            type=semver,pattern={{version}},value=${{ inputs.tag_name || github.ref_name }},enable=${{ matrix.is_default }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name || github.ref_name }},enable=${{ matrix.is_default }}
            # Explicit versioned flavor tags (:0.1.2-cuda, :0.1.2-cpu, :0.1.2-slim)
            type=semver,pattern={{version}}-${{ matrix.target }},value=${{ inputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.target }},value=${{ inputs.tag_name || github.ref_name }}
            # Explicit versioned alias tags (:0.1.2-full, :0.1.2-lite)
            type=semver,pattern={{version}}-full,value=${{ inputs.tag_name || github.ref_name }},enable=${{ matrix.target == 'cuda' }}
            type=semver,pattern={{version}}-lite,value=${{ inputs.tag_name || github.ref_name }},enable=${{ matrix.target == 'slim' }}

      - name: Create and push manifest list
        working-directory: /tmp/digests/${{ matrix.target }}
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DOCKER_META_TAGS: ${{ steps.meta.outputs.tags }}
          DOCKER_META_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=("-t" "$tag")
          done <<< "$DOCKER_META_TAGS"

          annotation_args=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && annotation_args+=("--annotation" "index:$label")
          done <<< "$DOCKER_META_LABELS"

          digest_refs=()
          for digest_file in *; do
            digest_refs+=("${IMAGE_NAME}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${annotation_args[@]}" \
            "${digest_refs[@]}"

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ matrix.target }}
